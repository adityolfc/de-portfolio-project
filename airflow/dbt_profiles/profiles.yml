# dbt profile used inside the Airflow containers (mounted via DBT_PROFILES_DIR).
# All connection values come from airflow/.env, so this file is safe to commit.
walmart_dbt:
  target: dev
  outputs:
    dev:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') | replace('https://', '') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      catalog: walmart
      schema: silver
      threads: 4
